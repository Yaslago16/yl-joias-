
<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YL Joias - Produto</title>

    <link rel="stylesheet" href="style.css">

    <style>

        .pagina-produto {
            min-height: 100vh;
            padding: 40px;
            background: #fff;
        }

        .voltar {
            display: inline-block;
            margin-bottom: 40px;

            color: #333;
            text-decoration: none;

            font-size: 16px;
        }

        .voltar:hover {
            color: #b08d57;
        }

        .produto-detalhes {
            max-width: 1100px;
            margin: auto;

            display: flex;
            align-items: center;
            gap: 70px;
        }

        .imagem-produto {
            width: 500px;
            height: 500px;

            object-fit: cover;
        }

        .informacoes-produto {
            flex: 1;
        }

        .informacoes-produto h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .preco {
            color: #b08d57;
            font-size: 28px;
            font-weight: bold;

            margin-bottom: 30px;
        }

        .descricao {
            color: #666;
            margin-bottom: 30px;
        }

        .quantidade {
            display: flex;
            align-items: center;

            width: 150px;

            border: 1px solid #ccc;

            margin-bottom: 25px;
        }

        .quantidade button {
            width: 45px;
            height: 45px;

            border: none;
            background: white;

            font-size: 22px;

            cursor: pointer;
        }

        .quantidade span {
            flex: 1;

            text-align: center;

            font-size: 18px;
        }

        .botao-carrinho {
            padding: 15px 35px;

            border: none;

            background: #b08d57;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .botao-carrinho:hover {
            background: #927342;
        }


        @media (max-width: 700px) {

            .pagina-produto {
                padding: 20px;
            }

            .produto-detalhes {
                flex-direction: column;

                gap: 30px;
            }

            .imagem-produto {
                width: 100%;
                height: auto;
            }

            .informacoes-produto h1 {
                font-size: 32px;
            }

        }

    </style>

</head>


<body>

    <main class="pagina-produto">

        <a href="index.html" class="voltar">
            ← Voltar para a loja
        </a>


        <div class="produto-detalhes">


            <!-- IMAGEM DO PRODUTO -->
            <div id="carouselProduto" class="carousel slide">
            
                <div class="carousel-indicators" id="indicadoresProduto">
                </div>
            
            
                <div class="carousel-inner" id="imagensProduto">
                </div>
            
            
            
                </button>
            
            </div>
        
            


            <!-- INFORMAÇÕES -->

            <div class="informacoes-produto">

                <h1 id="nomeProduto">
                    Produto
                </h1>

                <div
                    class="preco"
                    id="precoProduto">
                </div>

                <p class="descricao">
                    Joia exclusiva YL Joias, criada para
                    momentos especiais.
                </p>


                <!-- QUANTIDADE -->

                <div class="quantidade">

                    <button onclick="diminuir()">
                        −
                    </button>

                    <span id="quantidade">
                        1
                    </span>

                    <button onclick="aumentar()">
                        +
                    </button>

                </div>


                <!-- CARRINHO -->

                <button
                    class="botao-carrinho"
                    onclick="adicionarCarrinho()">

                    🛒 Adicionar ao carrinho

                </button>

            </div>

        </div>

    </main>


    
    <script>

        const nome =
            localStorage.getItem("nomeProduto");
        
        const preco =
            localStorage.getItem("precoProduto");
        
        const imagens =
            JSON.parse(
                localStorage.getItem("imagensProduto")
            );
        
        
        document.getElementById("nomeProduto")
            .textContent = nome;
        
        document.getElementById("precoProduto")
            .textContent = preco;
        
        
        /* CARROSSEL */
        
        const container =
            document.getElementById("imagensProduto");
        
        const indicadores =
            document.getElementById("indicadoresProduto");
        
        
        imagens.forEach((imagem, index) => {
        
            const slide =
                document.createElement("div");
        
            slide.classList.add("carousel-item");
        
            if (index === 0) {
                slide.classList.add("active");
            }
        
        
            const img =
                document.createElement("img");
        
            img.src = imagem;
        
            img.alt = nome;
        
            img.classList.add(
                "d-block",
                "w-100",
                "imagem-produto"
            );
        
        
            slide.appendChild(img);
        
            container.appendChild(slide);
        
        
            /* INDICADOR */
        
            const indicador =
                document.createElement("button");
        
            indicador.type = "button";
        
            indicador.setAttribute(
                "data-bs-target",
                "#carouselProduto"
            );
        
            indicador.setAttribute(
                "data-bs-slide-to",
                index
            );
        
            if (index === 0) {
                indicador.classList.add("active");
            }
        
            indicadores.appendChild(indicador);
        
        });
        
        
        /* QUANTIDADE */
        
        let quantidade = 1;
        
        
        function aumentar() {
        
            quantidade++;
        
            document.getElementById("quantidade")
                .textContent = quantidade;
        
        }
        
        
        function diminuir() {
        
            if (quantidade > 1) {
                quantidade--;
            }
        
            document.getElementById("quantidade")
                .textContent = quantidade;
        
        }
        
        
        /* CARRINHO */
        
     
function adicionarCarrinho() {

    // Pega o carrinho que já existe no navegador.
    // Se não existir, cria um carrinho vazio.
    let carrinho =
        JSON.parse(localStorage.getItem("carrinho")) || [];


    // Transforma o preço:
    // R$ 4.000,00
    // em:
    // 4000

    const precoNumerico =
        Number(
            preco
                .replace("R$", "")
                .replace(/\./g, "")
                .replace(",", ".")
                .trim()
        );


    // Procura se esse produto já está no carrinho.

    const produtoExistente =
        carrinho.find(
            produto => produto.nome === nome
        );


    // Se já existe, soma a nova quantidade.

    if (produtoExistente) {

        produtoExistente.quantidade += quantidade;

    } else {

        // Se ainda não existe,
        // adiciona o produto ao carrinho.

        carrinho.push({

            nome: nome,

            preco: precoNumerico,

            imagem: imagens[0],

            quantidade: quantidade

        });

    }


    // Salva o carrinho no navegador.

    localStorage.setItem(
        "carrinho",
        JSON.stringify(carrinho)
    );


    // Depois de adicionar,
    // abre a página do carrinho.

    window.location.href = "carrinho.html";

}


        
        </script>
</body>

</html>
